[project]
name = "jarvis-core"
version = "2.0.0a30"
description = "Jarvis V2 core: run engine, agent loop, model adapters, web server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jarvis-proto",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "mcp>=1.2",
    "mcp-server-fetch>=2026.8.18",
    "croniter>=3.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "qrcode>=7.4",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    # Attachments: a phone photo is 4000 px wide and the model reads none of that, so images are
    # resized on the way in; PDFs are the one document type the core reads on its own (Office
    # files go through the host, which has Office installed).
    "pillow>=10.4",
    "pypdf>=5.0",
]

[project.scripts]
jarvis-core = "jarvis_core.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_core"]
