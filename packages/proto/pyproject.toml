[project]
name = "jarvis-proto"
version = "2.0.0a11"
description = "Jarvis V2 protocol: messages, tool results, run events, settings (pydantic v2)"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_proto"]
