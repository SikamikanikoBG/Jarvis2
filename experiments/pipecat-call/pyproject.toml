[project]
name = "jarvis-pipecat-call"
version = "0.1.0"
description = "Step 1 prototype: a Jarvis voice call over WebRTC with Pipecat (not production)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pipecat-ai[local-smart-turn-v3,silero,webrtc]>=1.12.0",
    "soundfile>=0.13.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
