[project]
name = "jarvis-host"
version = "2.0.0a5"
description = "Jarvis V2 host daemon: exposes a machine's local capabilities as an MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jarvis-proto",
    "mcp>=1.2",
    "httpx>=0.28",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "pyaudiowpatch==0.2.12.8; sys_platform == 'win32'",
    "mss>=9; sys_platform == 'win32'",
]

[project.scripts]
jarvis-host = "jarvis_host.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_host"]
